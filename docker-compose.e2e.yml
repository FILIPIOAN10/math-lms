# Only for the E2E workflow (.github/workflows/e2e.yml), on top of docker-compose.prod.yml: the fake inbox the email
# tests read (Mailpit), on the stack's network, so the backend sends to SMTP_HOST=mailpit. Never on a real server.
services:
  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
