services:
  postgres:
    # pgvector/pgvector is the official Postgres image plus the `vector` extension (the tutor service stores
    # embeddings here). Same major version as before; it is Debian-based, not Alpine, so after switching an old
    # volume run `REINDEX DATABASE mathlms` (text ordering differs between the two C libraries).
    image: pgvector/pgvector:pg16
    container_name: mathlms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mathlms
      POSTGRES_USER: mathlms
      POSTGRES_PASSWORD: mathlms_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathlms -d mathlms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mathlms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The tutor's help chain over HTTP (tutor/), called only by the backend ("Sugerează indicii (AI)" in the question
  # editor). Opt-in: `docker compose --profile tutor up -d --build tutor`. GEMINI_PROJECT and GEMINI_CREDENTIALS_FILE come from tutor/.env; the
  # token must equal the backend's TUTOR_SERVICE_TOKEN. Bound to localhost: the browser never talks to it.
  tutor:
    build: ./tutor
    container_name: mathlms-tutor
    profiles: ["tutor"]
    restart: unless-stopped
    env_file: ./tutor/.env
    environment:
      DATABASE_URL: postgresql+psycopg://mathlms:mathlms_dev_password@postgres:5432/mathlms
      SERVICE_TOKEN: ${TUTOR_SERVICE_TOKEN:-dev-tutor-token}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: