spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: math-lms-backend

  # Boot 4 serialises with Jackson 3, whose defaults differ from Jackson 2 (alphabetical property order,
  # enums via toString(), null for a primitive = 400...). Keep the Jackson 2 behaviour the frontend was built on.
  jackson:
    use-jackson2-defaults: true

  datasource:
    url: jdbc:postgresql://localhost:5433/mathlms
    username: mathlms
    password: mathlms_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Every @Scheduled job shares this pool. Spring's default is ONE thread, so an AI import tick (several provider
  # reads of up to ~2 min each) held back the timed-test auto-submit, the outbox emails and the reminders. Each
  # fixed-delay job uses at most one thread at a time; 4 leaves room for the rest while the AI worker is busy.
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: "scheduling-"

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  data:
    redis:
      host: localhost
      port: 6379

  # SMTP: trimitem emailuri de verificare / reset parola / aprobare (Step 1.6a).
  # Pentru Gmail: SMTP_USER = adresa, SMTP_PASS = App Password (necesita 2FA activ).
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is NOT public: it needs the bearer token (app.metrics.token) and nginx never proxies /actuator.
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # buckets for http.server.requests so Prometheus can compute p95 latency
      percentiles-histogram:
        http.server.requests: true
  health:
    # An SMTP outage must NOT make the app "unhealthy": mail is queued in the outbox and retried (Phase 5.6), so the
    # service is fine without it. With the check on, a missing/slow mail server took the whole backend out of rotation.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when-authorized

app:
  auth:
    admin-emails: ${ADMIN_EMAILS}
    allowed-emails: ${ALLOWED_EMAILS:}
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    # Secure flag on the auth cookie. Defaults true (HTTPS/prod); set COOKIE_SECURE=false
    # only for local plain-HTTP development, otherwise the browser won't send the cookie.
    cookie-secure: ${COOKIE_SECURE:true}
    # Lifetime of a Redis-backed refresh-token session (rotated on every /api/auth/refresh).
    refresh-expiration-days: ${REFRESH_EXPIRATION_DAYS:7}
    # F8: an ADMIN must set up two-step sign-in (authenticator app) before the staff pages open. false only for local
    # dev and automated tests (TWO_FACTOR_REQUIRED_FOR_ADMIN=false); never in production.
    two-factor:
      required-for-admin: ${TWO_FACTOR_REQUIRED_FOR_ADMIN:true}
  # Base URL of the frontend; verification / reset email links point here.
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # Bearer token Prometheus presents to scrape /actuator/prometheus. EMPTY = the endpoint is locked for everyone.
  metrics:
    token: ${METRICS_TOKEN:}
  # Transactional outbox: durable, retried side effects (Phase 5.6). The poller is a no-op when disabled.
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:15000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-batches-per-tick: ${OUTBOX_MAX_BATCHES_PER_TICK:10}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    base-backoff-seconds: ${OUTBOX_BASE_BACKOFF_SECONDS:30}
    done-retention-days: ${OUTBOX_DONE_RETENTION_DAYS:14}
  # Emails sent when a result is ready (student + linked parent). OFF by default so dev/tests never mail
  # anyone; set NOTIFY_RESULT_READY=true where SMTP is real.
  notifications:
    result-ready:
      enabled: ${NOTIFY_RESULT_READY:false}
    # "Homework due soon" reminder (E7): one email per student who has not handed in, once per assignment, queued
    # ~24 h before the deadline. OFF by default for the same reason; set NOTIFY_ASSIGNMENT_REMINDER=true where SMTP is real.
    assignment-reminder:
      enabled: ${NOTIFY_ASSIGNMENT_REMINDER:false}
  # While that reminder is on, a student's linked parent gets their own copy too; false = students only.
  assignments:
    remind-parents: ${NOTIFY_ASSIGNMENT_REMINDER_PARENTS:true}
  # File storage: local filesystem now, S3/MinIO drop-in later (see FileService seam).
  storage:
    quiz-photos-dir: ${QUIZ_PHOTOS_DIR:uploads/quiz-photos}
    # Pictures under question statements (EN figures); inside the same uploads volume, so backups include them.
    question-images-dir: ${QUESTION_IMAGES_DIR:uploads/question-images}
    # EN chapter pages: theory photos and worked-example figures (same uploads volume, so backups include them).
    en-chapter-images-dir: ${EN_CHAPTER_IMAGES_DIR:uploads/en-chapters}
    # F11: FILE_STORAGE_PROVIDER=s3 keeps every file above in a PRIVATE S3 bucket (key = <dir>/<name>, same names as on
    # disk). On EC2 the instance role gives the credentials; keys only for another S3 (a local mock). See docs/DEPLOY.md.
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:eu-central-1}
      endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  # Faza 3: a quiz from photographed textbook pages (only textbook pages - never student work or personal data).
  # OFF by default. AI_PROVIDER=gemini needs a Google Cloud service-account key (GEMINI_*); AI_PROVIDER=openai needs
  # OPENAI_API_KEY in .env; AI_PROVIDER=fake reads made-up questions (dev).
  ai:
    enabled: ${AI_IMPORT_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    max-pages: ${AI_MAX_PAGES:5}
    # Per teacher per day (Romanian midnight to midnight): bounds the provider bill.
    daily-page-limit: ${AI_DAILY_PAGE_LIMIT:50}
    # Inside the uploads volume; files are deleted once the quiz is made, or after keep-pages-days.
    pages-dir: ${AI_PAGES_DIR:uploads/ai-pages}
    keep-pages-days: ${AI_KEEP_PAGES_DAYS:7}
    fake-delay-ms: ${AI_FAKE_DELAY_MS:2000}
    # The OpenAI reader (AI_PROVIDER=openai). The key lives only in .env (gitignored). gpt-6-luna is OpenAI's model for
    # cost-sensitive, high-volume work ($0.10 in / $0.50 out per 1M tokens, 2026-10); OPENAI_MODEL switches it.
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-6-luna}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
      image-detail: ${OPENAI_IMAGE_DETAIL:high}
    # The Gemini reader (AI_PROVIDER=gemini) on Google Cloud (Vertex AI / Agent Platform), billed to the project - so a
    # Cloud free-trial credit pays for it, unlike an AI Studio key. Sign-in: the JSON key of a service account with the
    # "Agent Platform user" role, kept OUTSIDE the repo. Location "global" serves the newest models (2026-10:
    # gemini-3.8-flash); a region such as europe-west1 keeps processing in the EU but only offers gemini-2.5-*.
    gemini:
      credentials-file: ${GEMINI_CREDENTIALS_FILE:}
      project: ${GEMINI_PROJECT:}
      location: ${GEMINI_LOCATION:global}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      # The strongest model, for what must be right rather than cheap: reading a test's barem and proposing grades
      # (2026-10: gemini-4-argon, $2 in / $10 out per 1M tokens until 2026-11-30, then $4 / $20).
      strong-model: ${GEMINI_STRONG_MODEL:gemini-4-argon}
      # How long the strong model thinks before it answers (LOW, MEDIUM, HIGH): thinking is billed as output, so it was
      # most of the cost of a proposal. Empty = the model's own default.
      grading-thinking-level: ${GEMINI_GRADING_THINKING:MEDIUM}
      barem-thinking-level: ${GEMINI_BAREM_THINKING:LOW}
    # The barem read from photos + the AI's grade proposals on Subiectul III (user's decisions 2026-10-26: Google only,
    # the AI proposes, the teacher confirms). OFF unless AI_GRADING_ENABLED=true. Sends the barem photos, and for a
    # proposal the photos of one answer with its statement and barem - never a name or an account.
    grading:
      enabled: ${AI_GRADING_ENABLED:false}
      # gemini, or fake (made-up barem and grades, no network) for dev.
      provider: ${AI_GRADING_PROVIDER:gemini}
      # Answers proposed per day for the whole app (Romanian midnight to midnight): bounds the bill.
      daily-answer-limit: ${AI_GRADING_DAILY_LIMIT:300}
      barem-max-pages: ${AI_BAREM_MAX_PAGES:5}
      barem-daily-page-limit: ${AI_BAREM_DAILY_PAGES:20}
  # The tutor service (tutor/, FastAPI): "Sugerează indicii (AI)" in the question editor writes a hint, a bigger hint
  # and the solution from the EN chapter pages only, with their pages. OFF unless TUTOR_ENABLED=true. Sends only the
  # question's text and its exam position. The token must equal the service's SERVICE_TOKEN; the timeout stays under
  # nginx's 60 s because the teacher waits for the answer.
  tutor:
    enabled: ${TUTOR_ENABLED:false}
    base-url: ${TUTOR_BASE_URL:http://localhost:8001}
    token: ${TUTOR_SERVICE_TOKEN:}
    timeout: ${TUTOR_TIMEOUT:55s}

# Rate limiting (Phase 6.1): per-endpoint fixed windows in Redis, rules in RateLimitConfig.
rate:
  limit:
    # false = no limits at all (local E2E logs in dozens of times a minute). Keep true in production.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # true ONLY behind a reverse proxy you control that sets X-Forwarded-For (nginx in the prod compose);
    # otherwise every client could forge its own bucket. Behind nginx with this false, everyone shares one bucket.
    trust-x-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}

# Storage provider selector for the FileService seam (local | s3). Local is the default.
file:
  storage:
    provider: ${FILE_STORAGE_PROVIDER:local}

logging:
  # Every log line carries the request's correlation id (CorrelationIdFilter); [] when logging outside a request.
  pattern:
    level: "%5p [%X{requestId:-}]"
  # LOG_FORMAT=logstash (or ecs) switches the console to structured JSON — one object per line with the MDC
  # fields (requestId) — for log shippers (Loki, ELK). Empty (default) = the readable text format for dev.
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    # Verbose security logging is a dev aid, not for prod (it narrates the auth flow).
    # Defaults to INFO; set SECURITY_LOG_LEVEL=DEBUG in .env for local debugging.
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
