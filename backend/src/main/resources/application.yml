spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: math-lms-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/mathlms
    username: mathlms
    password: mathlms_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  auth:
    admin-emails: ${ADMIN_EMAILS}
    allowed-emails: ${ALLOWED_EMAILS:}
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    org.springframework.security: DEBUG
