# Tests drive OutboxProcessor directly; a background poller would race the assertions.
app.outbox.enabled=false
# Most tests log in / hit auth endpoints repeatedly from 127.0.0.1; the rate-limit tests switch this on themselves.
rate.limit.enabled=false
# AI import (Faza 3) on, with the offline fake reader; tests call AiImportService.processNext() themselves.
app.ai.enabled=true
app.ai.provider=fake
app.ai.fake-delay-ms=0
app.ai.worker.enabled=false
app.ai.pages-dir=target/test-ai-pages
app.auth.two-factor.required-for-admin=false
