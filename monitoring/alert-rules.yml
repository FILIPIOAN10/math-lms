groups:
  - name: mathlms
    rules:
      - alert: BackendDown
        expr: up{job="math-lms"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The math-lms backend is not answering Prometheus scrapes

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: More than 0.05 server errors (5xx) per second

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: p95 request latency above 500 ms

      - alert: DatabaseConnectionPoolHigh
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: More than 80% of the database connections are in use

      # Heap only: other pools report max = -1, which would give nonsense ratios.
      - alert: JVMHeapUsageHigh
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: JVM heap above 85%

      - alert: FailedLoginBruteForce
        expr: rate(security_failed_logins_total[5m]) > 0.2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Possible brute-force attack — high failed-login rate

      - alert: RateLimitSpike
        expr: sum(rate(rate_limit_blocked_total[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Many requests are being rate-limited (attack, or a rule that is too tight)

      # A DEAD outbox event is a result email that will never be sent unless a human fixes it.
      - alert: OutboxDeadLetters
        expr: outbox_events{status="dead"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox events were dead-lettered (see outbox_event where status = 'DEAD')

      - alert: OutboxBacklog
        expr: outbox_events{status="pending"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The outbox is not draining (SMTP down, or the dispatcher stopped)
