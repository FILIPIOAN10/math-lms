# Local development: the backend runs on the host machine (see docker-compose.monitoring.yml).
# For the production stack use monitoring/prometheus.prod.yml (target backend:8080 on the compose network).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'math-lms'
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
