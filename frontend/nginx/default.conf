# nginx: static SPA + same-origin reverse proxy to the Spring backend (Phase 6.4).

map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";                       # an empty value omits the header
}

# The scheme the BROWSER used (a TLS proxy in front sets X-Forwarded-Proto; otherwise it is plain http).
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https   https;
}

# Access log with the request id nginx hands to the backend (X-Request-Id): grep one id in both logs.
log_format mathlms '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" rid=$request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log mathlms;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Photo uploads: the backend accepts 8 MB.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A TLS-terminating proxy / load balancer on a PRIVATE address may tell us the real client in
    # X-Forwarded-For; from anyone else the header is ignored (so it cannot be forged to dodge rate limits).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # NOTE: no server-level security headers. The SPA locations below add them; proxied API responses already
    # carry the backend's own set (SecurityConfig) — adding ours too would send every header twice.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metrics and actuator are for the internal network only (Prometheus scrapes backend:8080 directly).
    location /actuator/ {
        return 404;
    }

    location /api/ {
        include /etc/nginx/conf.d/proxy-params.inc;
        proxy_pass http://backend:8080;
    }

    # Google sign-in: start (/oauth2/authorization/google) and callback (/login/oauth2/code/google).
    location /oauth2/ {
        include /etc/nginx/conf.d/proxy-params.inc;
        proxy_pass http://backend:8080;
    }

    location /login/oauth2/ {
        include /etc/nginx/conf.d/proxy-params.inc;
        proxy_pass http://backend:8080;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app (client-side routing); /login, /quizzes, ... all serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
