# Same hardening set as the API (SecurityConfig). Kept in a snippet because nginx DROPS inherited
# add_header directives as soon as a location adds its own — every location includes this file.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;
# HSTS only when the request reached us over HTTPS through the TLS-terminating proxy in front.
add_header Strict-Transport-Security $hsts always;
