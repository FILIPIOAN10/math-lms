<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>Ești offline · Math LMS</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <!-- Shown by the service worker when a page cannot be loaded. No script: the CSP allows none inline. -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #171717;
      }
      main { max-width: 26rem; background: #fff; border-radius: 16px; padding: 24px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.25rem; margin: 12px 0 8px; }
      p { margin: 0 0 16px; color: #525252; line-height: 1.5; }
      a { display: inline-block; padding: 10px 16px; border-radius: 10px; background: #171717; color: #fafafa; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        main { background: #171717; }
        p { color: #a3a3a3; }
        a { background: #fafafa; color: #171717; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Ești offline</h1>
      <p>Math LMS are nevoie de internet ca să-ți arate testele, temele și notele. Răspunsurile tale salvate până acum sunt
        în siguranță pe server.</p>
      <a href="/">Încearcă din nou</a>
    </main>
  </body>
</html>
