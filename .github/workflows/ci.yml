name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Anuleaza rulari vechi pe acelasi branch cand apare un push nou
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Valori dummy pentru testul cu context complet. NU sunt secrete reale —
    # testele nu apeleaza Google; au nevoie doar ca proprietatile sa existe.
    env:
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      ADMIN_EMAILS: admin@test.com
      ALLOWED_EMAILS: ""
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_EXPIRATION_MINUTES: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and test (Testcontainers foloseste Docker-ul de pe runner)
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
