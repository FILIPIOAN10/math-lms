name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Anuleaza rulari vechi pe acelasi branch cand apare un push nou
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Valori dummy pentru testul cu context complet. NU sunt secrete reale —
    # testele nu apeleaza Google; au nevoie doar ca proprietatile sa existe.
    env:
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      ADMIN_EMAILS: admin@test.com
      ALLOWED_EMAILS: ""
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_EXPIRATION_MINUTES: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and test (Testcontainers foloseste Docker-ul de pe runner)
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

  tutor:
    name: Tutor (Python, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor
    # The database tests build a throwaway database from the real Flyway migrations (tests/conftest.py), on the same
    # image as production and on the port and credentials the tutor's settings default to - nothing to configure.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mathlms
          POSTGRES_USER: mathlms
          POSTGRES_PASSWORD: mathlms_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mathlms -d mathlms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (and Python 3.13, as in the image)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: tutor/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      # No model and no key: the chain and the service run with fake models; only the database is real.
      - name: Unit + database tests
        run: uv run pytest -q -rs

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security (Trivy CVE scan + dependency review)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans pom.xml, package-lock.json and the Dockerfiles for known CVEs. Fixed CRITICAL/HIGH ones fail
      # the build; vulnerabilities without an available fix are ignored (nothing to do about them yet).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          skip-dirs: backend/target,frontend/node_modules,frontend/dist

      - name: Dependency review (new vulnerable dependencies in the PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high

  docker-build:
    name: Docker images build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Catches a broken Dockerfile / nginx config on the PR instead of at release time.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build tutor image
        uses: docker/build-push-action@v6
        with:
          context: ./tutor
          push: false
          cache-from: type=gha,scope=tutor
          cache-to: type=gha,scope=tutor,mode=max
