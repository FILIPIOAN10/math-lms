name: E2E (Selenium)

# The whole product in real Chrome against the REAL production stack (docker-compose.prod.yml):
# nginx + backend + Postgres + Redis. Manual — it is slow and builds both images.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Selenium against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test environment (throwaway secrets, HTTP, limits off)
        run: |
          cat > .env.e2e <<EOF
          FRONTEND_BASE_URL=http://localhost:8088
          HTTP_PORT=8088
          COOKIE_SECURE=false
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          ADMIN_EMAILS=admin@mathlms.local
          RATE_LIMIT_ENABLED=false
          EOF

      - name: Start the stack
        run: docker compose -f docker-compose.prod.yml --env-file .env.e2e up -d --build --wait --wait-timeout 300

      - name: Seed the test accounts
        run: docker compose -f docker-compose.prod.yml --env-file .env.e2e exec -T postgres psql -U mathlms -d mathlms < deploy/e2e-seed.sql

      - name: Run the E2E suite
        working-directory: backend
        run: bash mvnw -B test -Dgroups=e2e -DexcludedGroups= -De2e.baseUrl=http://localhost:8088 -De2e.apiUrl=http://localhost:8088

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.e2e logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.e2e down -v
